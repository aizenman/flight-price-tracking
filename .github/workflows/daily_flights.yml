name: Daily nonstop flight search

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily (8:00 AM New York in winter, 9:00 AM in summer)
  workflow_dispatch:

permissions:
  contents: write   # needed to commit results back to the repo

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install flights pandas openpyxl pyarrow

      - name: Run searches
        run: |
          mkdir -p output
          python src/get_nonstops.py --file config/searches.xlsx --out-dir output \
            | tee "output/log_$(date -u +%Y%m%d).txt"

      - name: Commit results to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Flight results for $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi